<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc"><title id="title">Proposed first-stage allocation: 100,000 USD</title><desc id="desc">Technical specialists 60,000 USD, founder partial compensation 8,000, isolated test infrastructure 8,000, models and tools 3,000, legal and administration 7,000, contingency 14,000. This is a proposed budget, not funds raised.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1830"/><stop offset="1" stop-color="#14344a"/></linearGradient></defs><rect width="1100" height="540" rx="22" fill="url(#bg)"/><g font-family="Arial,Helvetica,sans-serif"><text x="48" y="62" fill="#f1f8ff" font-size="30" font-weight="700">FIRST MILESTONE · PROPOSED ALLOCATION</text><text x="48" y="108" fill="#9dfff0" font-size="42" font-weight="700">$100,000</text><text x="265" y="106" fill="#c0d4e8" font-size="17">NET AVAILABLE TARGET · NOT FUNDS RAISED</text><line x1="48" y1="133" x2="1050" y2="133" stroke="#416174"/><g font-size="20" fill="#eef5fc"><text x="48" y="175">Technical specialists</text><text x="48" y="239">Founder compensation</text><text x="48" y="303">Isolated test infrastructure</text><text x="48" y="367">Model calls and tools</text><text x="48" y="431">Legal and administration</text><text x="48" y="495">Contingency</text></g><g fill="#d5e4f1" font-size="19" text-anchor="end" font-weight="700"><text x="1040" y="175">$60,000 · 60%</text><text x="1040" y="239">$8,000 · 8%</text><text x="1040" y="303">$8,000 · 8%</text><text x="1040" y="367">$3,000 · 3%</text><text x="1040" y="431">$7,000 · 7%</text><text x="1040" y="495">$14,000 · 14%</text></g><g fill="#244158"><rect x="402" y="156" width="393" height="23" rx="9"/><rect x="402" y="220" width="393" height="23" rx="9"/><rect x="402" y="284" width="393" height="23" rx="9"/><rect x="402" y="348" width="393" height="23" rx="9"/><rect x="402" y="412" width="393" height="23" rx="9"/><rect x="402" y="476" width="393" height="23" rx="9"/></g><g><rect x="402" y="156" width="393" height="23" rx="9" fill="#58ddc7"/><rect x="402" y="220" width="52" height="23" rx="9" fill="#77a5ff"/><rect x="402" y="284" width="52" height="23" rx="9" fill="#77a5ff"/><rect x="402" y="348" width="20" height="23" rx="9" fill="#b1a1ff"/><rect x="402" y="412" width="46" height="23" rx="9" fill="#b1a1ff"/><rect x="402" y="476" width="92" height="23" rx="9" fill="#f5bd71"/></g></g></svg>